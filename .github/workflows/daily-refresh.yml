name: Daily data refresh

on:
  schedule:
    - cron: "30 4 * * 1-5"   # 10:00 IST, Monday to Friday (NAVs are published on business days)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas matplotlib

      - name: Download latest NAVs
        run: python fetch_data.py

      - name: Run checks and analysis
        run: python analysis.py

      - name: Commit if anything changed
        run: |
          git config user.name "Milind Saxena"
          git config user.email "97323171+BoredMongoose@users.noreply.github.com"
          git add output images README.md
          if git diff --cached --quiet; then
            echo "No new data today"
          else
            git commit -m "Data refresh: NAVs to $(date -u +%Y-%m-%d)"
            git push
          fi
